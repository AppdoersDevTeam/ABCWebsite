name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate changelog, version, and migrations
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Production build
        run: npm run build
